run_type = "staged_learning"
device   = "cpu"
tb_logdir = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage3/tb"
json_out_config = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage3/_stage3.json"

[parameters]
prior_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/FS_Ro5_10M.model"
agent_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage1/stage1.chkpt"
summary_csv_prefix = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage3/stage3"
batch_size         = 80
use_checkpoint     = false

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[[stage]]
max_score  = 1.0
max_steps  = 400
chkpt_file = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage3/stage3.chkpt"

[stage.scoring]
type = "geometric_mean"

# ── Structural gates ─────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name   = "Alerts"
weight = 1.0
params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[Fe,Co,Ni,Cu,Zn,Ru,Rh,Pd,Ag,Os,Ir,Pt,Au]"
]

[[stage.scoring.component]]
[stage.scoring.component.PhotoswitchScaffold]
[[stage.scoring.component.PhotoswitchScaffold.endpoint]]
name   = "PS_Scaffold"
weight = 1.0

[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name   = "SA"
weight = 0.5
transform.type = "reverse_sigmoid"
transform.high = 8.0
transform.low  = 2.0
transform.k    = 0.4
# ChemProp λ_max skipped — model not trained
# ChemProp t½ skipped — model not trained

# ── Diversity ────────────────────────────────────────────────────────────
[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 10
minscore    = 0.7

[inception]
smiles_file = ""
memory_size = 100
sample_size = 10
