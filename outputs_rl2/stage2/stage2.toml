run_type = "staged_learning"
device   = "cpu"
tb_logdir = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage2/tb"
json_out_config = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage2/_stage2.json"

[parameters]
prior_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/FS_Ro5_10M.model"
agent_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage1/stage1.chkpt"
summary_csv_prefix = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage2/stage2"
batch_size         = 40
use_checkpoint     = false

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[[stage]]
max_score  = 1.0
max_steps  = 300
chkpt_file = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs_rl2/stage2/stage2.chkpt"

[stage.scoring]
type = "geometric_mean"

# ── Structural gates (from Stage 1) ──────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name   = "Alerts"
weight = 1.0
params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[Fe,Co,Ni,Cu,Zn,Ru,Rh,Pd,Ag,Os,Ir,Pt,Au]"
]

[[stage.scoring.component]]
[stage.scoring.component.PhotoswitchScaffold]
[[stage.scoring.component.PhotoswitchScaffold.endpoint]]
name   = "PS_Scaffold"
weight = 1.0

[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name   = "SA"
weight = 0.5
transform.type = "reverse_sigmoid"
transform.high = 8.0
transform.low  = 2.0
transform.k    = 0.4

# ── xTB λ_max filter (new) ──────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.XTBLambdaFilter]

[[stage.scoring.component.XTBLambdaFilter.endpoint]]
name   = "xTB_Lambda"
weight = 0.8

params.lambda_cutoff = [300.0]
params.lambda_target = [450.0]
params.lambda_sigma  = [100.0]

# ── xTB E/Z isomer gap (new) ────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.XTBIsomerGap]

[[stage.scoring.component.XTBIsomerGap.endpoint]]
name   = "EZ_Gap"
weight = 0.7

params.de_min_kcal    = [5.0]
params.de_target_kcal = [15.0]
params.de_sigma_kcal  = [8.0]

# ── Diversity ────────────────────────────────────────────────────────────
[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 10
minscore    = 0.6

[inception]
smiles_file = ""
memory_size = 100
sample_size = 10
