run_type = "staged_learning"
device = "cpu"
[parameters]
prior_file = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/reinvent.prior"
agent_file = "outputs_dasa/verify3/s2.chkpt"
summary_csv_prefix = "outputs_dasa/verify3/stage3"
batch_size = 64
use_checkpoint = false
[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001
[[stage]]
max_score = 1.0
max_steps = 12
chkpt_file = "outputs_dasa/verify3/s3.chkpt"
[stage.scoring]
type = "geometric_mean"
[[stage.scoring.component]]
[stage.scoring.component.DASAScaffold]
[[stage.scoring.component.DASAScaffold.endpoint]]
name = "DASA"
weight = 1.0
[[stage.scoring.component]]
[stage.scoring.component.AqueousSolubility]
[[stage.scoring.component.AqueousSolubility.endpoint]]
name = "Solubility"
weight = 0.6
params.logs_target = -2.0
params.logs_width = 1.5
params.logp_max = 3.0
[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name = "SA"
weight = 0.5
transform.type = "reverse_sigmoid"
transform.high = 8.0
transform.low = 2.0
transform.k = 0.4
