run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "/work/outputs_dasa/trial_stage1/tb"
[parameters]
prior_file = "/work/reinvent.prior"
agent_file = "/work/outputs_dasa/TL_dasa_trial.model"
summary_csv_prefix = "/work/outputs_dasa/trial_stage1/stage1"
batch_size = 128
use_checkpoint = false
[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001
[[stage]]
max_score = 1.0
max_steps = 500
chkpt_file = "/work/outputs_dasa/trial_stage1/stage1.chkpt"
[stage.scoring]
type = "geometric_mean"
[[stage.scoring.component]]
[stage.scoring.component.DASAScaffold]
[[stage.scoring.component.DASAScaffold.endpoint]]
name = "DASA"
weight = 1.0
[[stage.scoring.component]]
[stage.scoring.component.AqueousSolubility]
[[stage.scoring.component.AqueousSolubility.endpoint]]
name = "Solubility"
weight = 0.7
params.logs_target = -2.0
params.logs_width = 1.5
params.logp_max = 3.0
[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name = "SA"
weight = 0.4
transform.type = "reverse_sigmoid"
transform.high = 8.0
transform.low = 2.0
transform.k = 0.4
[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
[inception]
smiles_file = "/work/outputs_dasa/trial_corpus.smi"
memory_size = 100
sample_size = 10
