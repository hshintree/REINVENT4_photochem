
run_type = "staged_learning"
device = "cpu"
tb_logdir = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage3/tb_stage3"
json_out_config = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage3/_stage3.json"

[parameters]

prior_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/FS_Ro5_10M.model"
agent_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage2/stage2.chkpt"
summary_csv_prefix = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage3/stage3"
batch_size         = 40
use_checkpoint     = false

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[[stage]]
max_score  = 1.0
max_steps  = 200
chkpt_file = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage3/stage3.chkpt"

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]

[[stage.scoring.component.custom_alerts.endpoint]]
name   = "Alerts"
weight = 1.0

params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[Fe,Co,Ni,Cu,Zn,Ru,Rh,Pd,Ag,Os,Ir,Pt,Au]"
]

[[stage.scoring.component]]
[stage.scoring.component.PhotoswitchScaffold]

[[stage.scoring.component.PhotoswitchScaffold.endpoint]]
name   = "PS_Scaffold"
weight = 1.0
# VisAbs component skipped — ChemProp λ_max model not trained yet

[[stage.scoring.component]]
[stage.scoring.component.XTBHomoLumo]

[[stage.scoring.component.XTBHomoLumo.endpoint]]
name   = "xTB_Gap"
weight = 0.7

params.gap_min_ev = [0.9]
params.gap_max_ev = [1.4]

[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 10
minscore    = 0.7

[inception]
smiles_file = ""
memory_size = 100
sample_size = 10
