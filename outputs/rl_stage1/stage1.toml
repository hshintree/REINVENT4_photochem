run_type = "staged_learning"
device   = "cpu"
tb_logdir = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage1/tb"
json_out_config = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage1/_stage1.json"

[parameters]
prior_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/reinvent.prior"
agent_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/tl_run/TL_photoswitch.model.30.chkpt"
summary_csv_prefix = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage1/stage1"
batch_size         = 128
use_checkpoint     = false

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[[stage]]
max_score  = 1.0
max_steps  = 500
chkpt_file = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage1/stage1.chkpt"

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name   = "Alerts"
weight = 1.0
params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]", "[*;r12]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[Fe,Co,Ni,Cu,Zn,Ru,Rh,Pd,Ag,Os,Ir,Pt,Au]"
]

[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name   = "SA"
weight = 0.6
transform.type = "reverse_sigmoid"
transform.high = 8.0
transform.low  = 2.0
transform.k    = 0.4

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name   = "QED"
weight = 0.3

[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 25
minscore    = 0.5

[inception]
smiles_file = ""
memory_size = 100
sample_size = 10
