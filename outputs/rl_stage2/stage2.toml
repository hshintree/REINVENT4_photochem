
run_type = "staged_learning"
device = "cpu"
tb_logdir = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage2/tb_stage2"
json_out_config = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage2/_stage2.json"

[parameters]

prior_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/FS_Ro5_10M.model"
agent_file         = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage1/stage1.chkpt"
summary_csv_prefix = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage2/stage2"
batch_size         = 100
use_checkpoint     = false

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[[stage]]
max_score  = 1.0
max_steps  = 600
chkpt_file = "/Users/hakeemshindy/Downloads/REINVENT4_photochem/outputs/rl_stage2/stage2.chkpt"

[stage.scoring]
type = "geometric_mean"

# ── 1. Structural alerts ───────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]

[[stage.scoring.component.custom_alerts.endpoint]]
name   = "Alerts"
weight = 1.0

params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]", "[*;r12]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[Fe,Co,Ni,Cu,Zn,Ru,Rh,Pd,Ag,Os,Ir,Pt,Au]"
]

# ── 2. Photoswitch scaffold ────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.PhotoswitchScaffold]

[[stage.scoring.component.PhotoswitchScaffold.endpoint]]
name   = "PS_Scaffold"
weight = 1.0
# VisAbs component skipped — ChemProp λ_max model not trained yet
# HalfLife component skipped — ChemProp t½ model not trained yet

# ── QED ───────────────────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.QED]

[[stage.scoring.component.QED.endpoint]]
name   = "QED"
weight = 0.4

# ── Diversity filter ───────────────────────────────────────────────────────
[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 10
minscore    = 0.7

# ── Inception ─────────────────────────────────────────────────────────────
[inception]
smiles_file = ""
memory_size = 100
sample_size = 10
